
name: RIG Sentinel Phase 1 CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-scan:
    name: Python 3.13 / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15

    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-24.04
          - ubuntu-26.04

    steps:
      - name: Check out source
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Show environment
        run: |
          cat /etc/os-release
          python --version

      - name: Install package and development tools
        run: |
          python -m pip install -e ".[dev]"

      - name: Run tests
        run: |
          python -m pytest -q

      - name: Generate SARIF scan
        run: |
          rig-sentinel scan . --sarif rig-sentinel.sarif

      - name: Validate SARIF format
        run: |
          python -c "import json; from pathlib import Path; p=json.loads(Path('rig-sentinel.sarif').read_text()); assert p['version']=='2.1.0'; assert len(p['runs'])>=1; print('SARIF valid')"

      - name: Upload SARIF artifact
        uses: actions/upload-artifact@v6
        with:
          name: rig-sentinel-sarif-${{ matrix.os }}
          path: rig-sentinel.sarif
          if-no-files-found: error
          retention-days: 14
