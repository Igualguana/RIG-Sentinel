
name: RIG Sentinel Phase 1 CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-scan:
    name: Python 3.13 / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20

    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-24.04
          - ubuntu-26.04
          - macos-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Show operating system and Python
        shell: bash
        run: |
          uname -a
          python --version
          python -m pip --version

      - name: Install package and development tools
        shell: bash
        run: |
          python -m pip install -e ".[dev]"

      - name: Run tests
        shell: bash
        run: |
          python -m pytest -q

      - name: Validate CLI
        shell: bash
        run: |
          rig-sentinel --help

      - name: Generate HTML report
        shell: bash
        run: |
          rig-sentinel scan . --html rig-sentinel.html
          test -s rig-sentinel.html

      - name: Generate SARIF report
        shell: bash
        run: |
          rig-sentinel scan . --sarif rig-sentinel.sarif
          test -s rig-sentinel.sarif

      - name: Validate SARIF format
        shell: bash
        run: |
          python -c "import json; from pathlib import Path; p=json.loads(Path('rig-sentinel.sarif').read_text()); assert p['version']=='2.1.0'; assert len(p['runs'])>=1; print('SARIF valid')"

      - name: Upload security reports
        uses: actions/upload-artifact@v6
        with:
          name: rig-sentinel-reports-${{ matrix.os }}
          path: |
            rig-sentinel.html
            rig-sentinel.sarif
          if-no-files-found: error
          retention-days: 14
