
name: RIG Sentinel Phase 1 CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-scan:
    name: Python ${{ matrix.python }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25

    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-24.04
          - ubuntu-26.04
          - macos-15-intel
        python:
          - "3.13"
        include:
          - os: ubuntu-24.04
            python: "3.11"
          - os: ubuntu-24.04
            python: "3.12"
          - os: macos-15-intel
            python: "3.11"
          - os: macos-15-intel
            python: "3.12"

    steps:
      - name: Check out source
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Python ${{ matrix.python }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}

      - name: Show system information
        shell: bash
        run: |
          echo "Operating system:"
          uname -a
          echo "Architecture:"
          uname -m
          echo "Python:"
          python --version
          echo "Pip:"
          python -m pip --version

      - name: Install RIG Sentinel and development dependencies
        shell: bash
        run: |
          python -m pip install -e ".[dev]"

      - name: Run all automated tests
        shell: bash
        run: |
          python -m pytest -q --junitxml=pytest-junit.xml

      # Diagnostic steps run even after a failed step (but not after cancellation); any failure
      # still fails the job.
      - name: Require native POSIX key-file coverage
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          python scripts/ci/assert_platform_coverage.py --junit pytest-junit.xml --profile ${{ runner.os == 'Linux' && 'linux' || 'macos' }}

      - name: Validate CLI
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          rig-sentinel --help

      - name: Generate HTML security report
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          rig-sentinel scan . --html rig-sentinel.html
          test -s rig-sentinel.html

      - name: Generate SARIF security report
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          rig-sentinel scan . --sarif rig-sentinel.sarif
          test -s rig-sentinel.sarif

      - name: Validate SARIF 2.1.0
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          python -c "import json; from pathlib import Path; p=json.loads(Path('rig-sentinel.sarif').read_text(encoding='utf-8')); assert p['version']=='2.1.0'; assert len(p['runs'])>=1; print('SARIF valid')"

      - name: Upload HTML and SARIF reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v6
        with:
          name: rig-sentinel-reports-${{ matrix.os }}-py${{ matrix.python }}
          path: |
            rig-sentinel.html
            rig-sentinel.sarif
            pytest-junit.xml
          if-no-files-found: warn
          retention-days: 14

  windows-ntfs:
    name: Python ${{ matrix.python }} / windows-2025 NTFS
    runs-on: windows-2025
    timeout-minutes: 25

    strategy:
      fail-fast: false
      matrix:
        python:
          - "3.11"
          - "3.12"
          - "3.13"

    steps:
      - name: Check out source
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Python ${{ matrix.python }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}

      - name: Show system information
        shell: pwsh
        run: |
          [System.Environment]::OSVersion.VersionString
          python --version
          python -m pip --version

      - name: Install RIG Sentinel and development dependencies
        shell: pwsh
        run: |
          python -m pip install -e ".[dev]"

      - name: Create a verified native NTFS test directory (system temp volume, 8.3 required)
        shell: pwsh
        run: |
          python scripts/ci/prepare_ntfs_test_dir.py --label py${{ matrix.python }}

      - name: Run all automated tests with native NTFS enabled
        shell: pwsh
        run: |
          python -m pytest -q --junitxml=pytest-junit.xml

      # Diagnostic steps run even after a failed step (but not after cancellation); any failure
      # still fails the job.
      - name: Require native NTFS key-file coverage
        if: ${{ !cancelled() }}
        shell: pwsh
        run: |
          python scripts/ci/assert_platform_coverage.py --junit pytest-junit.xml --profile windows-ntfs

      - name: Validate CLI
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          rig-sentinel --help

      - name: Generate HTML security report
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          rig-sentinel scan . --html rig-sentinel.html
          test -s rig-sentinel.html

      - name: Generate SARIF security report
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          rig-sentinel scan . --sarif rig-sentinel.sarif
          test -s rig-sentinel.sarif

      - name: Validate SARIF 2.1.0
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          python -c "import json; from pathlib import Path; p=json.loads(Path('rig-sentinel.sarif').read_text(encoding='utf-8')); assert p['version']=='2.1.0'; assert len(p['runs'])>=1; print('SARIF valid')"

      - name: Remove the NTFS test directory without following links
        if: always()
        shell: pwsh
        run: |
          python scripts/ci/remove_ntfs_test_dir.py

      - name: Upload HTML and SARIF reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v6
        with:
          name: rig-sentinel-reports-windows-2025-py${{ matrix.python }}
          path: |
            rig-sentinel.html
            rig-sentinel.sarif
            pytest-junit.xml
          if-no-files-found: warn
          retention-days: 14

  c2b-platform-mutants:
    name: C2-B ${{ matrix.profile }} mutants / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            profile: posix
          - os: macos-15-intel
            profile: posix
          - os: windows-2025
            profile: ntfs

    steps:
      - name: Check out source
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Python 3.13
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install RIG Sentinel (non-editable) and development dependencies
        shell: bash
        run: |
          python -m pip install ".[dev]"

      - name: Create a verified native NTFS test directory (system temp volume, 8.3 required)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          python scripts/ci/prepare_ntfs_test_dir.py --label mutants

      - name: Run the platform mutants (every mutant must be caught)
        shell: bash
        run: |
          python scripts/ci/c2b_platform_mutants.py --profile ${{ matrix.profile }}

      - name: Remove the NTFS test directory without following links
        if: always() && runner.os == 'Windows'
        shell: pwsh
        run: |
          python scripts/ci/remove_ntfs_test_dir.py

  # B2-M2-C2-C: audit-storage mutants. Each host runs only the profiles it can support; every profile
  # must catch all of its mutants, and an unsupported environment (exit 2) also fails the job.
  c2c-platform-mutants:
    name: C2-C ${{ matrix.profiles }} mutants / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            profiles: portable posix linux
          - os: macos-15-intel
            profiles: posix
          - os: windows-2025
            profiles: portable ntfs

    steps:
      - name: Check out source
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Python 3.13
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install RIG Sentinel (non-editable) and development dependencies
        shell: bash
        run: |
          python -m pip install ".[dev]"

      - name: Create a verified native NTFS test directory (system temp volume, 8.3 required)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          python scripts/ci/prepare_ntfs_test_dir.py --label c2c-mutants

      - name: Run the C2-C portable mutants (every mutant must be caught)
        if: contains(matrix.profiles, 'portable')
        shell: bash
        run: |
          python scripts/ci/c2c_platform_mutants.py --profile portable

      - name: Run the C2-C POSIX mutants (every mutant must be caught)
        if: contains(matrix.profiles, 'posix')
        shell: bash
        run: |
          python scripts/ci/c2c_platform_mutants.py --profile posix

      - name: Run the C2-C Linux mutants (every mutant must be caught)
        if: contains(matrix.profiles, 'linux')
        shell: bash
        run: |
          python scripts/ci/c2c_platform_mutants.py --profile linux

      - name: Run the C2-C NTFS mutants (every mutant must be caught)
        if: contains(matrix.profiles, 'ntfs')
        shell: bash
        run: |
          python scripts/ci/c2c_platform_mutants.py --profile ntfs

      - name: Remove the NTFS test directory without following links
        if: always() && runner.os == 'Windows'
        shell: pwsh
        run: |
          python scripts/ci/remove_ntfs_test_dir.py
