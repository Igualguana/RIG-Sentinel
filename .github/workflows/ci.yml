name: RIG Sentinel Phase 1 CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
      - name: Install package and test runner
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . pytest
      - name: Run tests
        run: python -m pytest -q
      - name: Generate SARIF scan
        run: rig-sentinel scan . --sarif rig-sentinel.sarif
      - name: Upload SARIF artifact
        uses: actions/upload-artifact@v4
        with:
          name: rig-sentinel-sarif
          path: rig-sentinel.sarif
          retention-days: 14
