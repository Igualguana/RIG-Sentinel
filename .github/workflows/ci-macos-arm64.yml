name: RIG Sentinel macOS Apple Silicon

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-scan:
    name: Python ${{ matrix.python }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25

    # Apple Silicon is validated in its own workflow so that GitHub-hosted runner
    # capacity delays do not mark the main CI workflow as failed. Real failures here
    # remain visible through this workflow's own status and README badge.
    strategy:
      fail-fast: false
      matrix:
        os:
          - macos-latest
        python:
          - "3.11"
          - "3.12"
          - "3.13"

    steps:
      - name: Check out source
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Python ${{ matrix.python }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}

      - name: Show system information
        shell: bash
        run: |
          echo "Operating system:"
          uname -a
          echo "Architecture:"
          uname -m
          echo "Python:"
          python --version
          echo "Pip:"
          python -m pip --version

      # B2-M2-C2-D: the native evidence below is Apple Silicon evidence only if both the runner and the
      # interpreter are arm64 (an x86_64 runner or a Rosetta interpreter would fail here, not pass).
      - name: Require a native arm64 runner and interpreter
        shell: bash
        run: |
          test "$(uname -m)" = "arm64"
          python -c "import platform, sys; m = platform.machine(); print('interpreter machine:', m); sys.exit(0 if m == 'arm64' else 1)"

      - name: Install RIG Sentinel and development dependencies
        shell: bash
        run: |
          python -m pip install -e ".[dev]"

      - name: Run all automated tests
        shell: bash
        run: |
          python -m pytest -q --junitxml=pytest-junit.xml

      # Diagnostic steps run even after a failed step (but not after cancellation); any failure
      # still fails the job.
      - name: Require native macOS coverage (C2-B, C2-C and C2-D; skipped means failed)
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          python scripts/ci/assert_platform_coverage.py --junit pytest-junit.xml --profile macos

      - name: Validate CLI
        shell: bash
        run: |
          rig-sentinel --help

      - name: Generate HTML security report
        shell: bash
        run: |
          rig-sentinel scan . --html rig-sentinel.html
          test -s rig-sentinel.html

      - name: Generate SARIF security report
        shell: bash
        run: |
          rig-sentinel scan . --sarif rig-sentinel.sarif
          test -s rig-sentinel.sarif

      - name: Validate SARIF 2.1.0
        shell: bash
        run: |
          python -c "import json; from pathlib import Path; p=json.loads(Path('rig-sentinel.sarif').read_text(encoding='utf-8')); assert p['version']=='2.1.0'; assert len(p['runs'])>=1; print('SARIF valid')"

      - name: Upload HTML and SARIF reports
        uses: actions/upload-artifact@v6
        with:
          name: rig-sentinel-reports-${{ matrix.os }}-py${{ matrix.python }}
          path: |
            rig-sentinel.html
            rig-sentinel.sarif
            pytest-junit.xml
          if-no-files-found: error
          retention-days: 14

  # B2-M2-C2-D: writer-lock mutants on Apple Silicon. Non-editable install, as in the main workflow's
  # mutant jobs, so the runner's temporary mutated copy of src/ is the code under test (its import probe
  # fails the run otherwise). Every mutant must be caught; an unsupported environment exits 2, which fails
  # the step (bash runs with -e), so it can never be reported as success.
  c2d-platform-mutants:
    name: C2-D portable posix mutants / ${{ matrix.os }} / py${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45

    strategy:
      fail-fast: false
      matrix:
        os:
          - macos-latest
        python:
          - "3.11"
          - "3.12"
          - "3.13"

    steps:
      - name: Check out source
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Python ${{ matrix.python }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}

      - name: Require a native arm64 runner and interpreter
        shell: bash
        run: |
          uname -a
          test "$(uname -m)" = "arm64"
          python -c "import platform, sys; m = platform.machine(); print('interpreter machine:', m); sys.exit(0 if m == 'arm64' else 1)"

      - name: Install RIG Sentinel (non-editable) and development dependencies
        shell: bash
        run: |
          python -m pip install ".[dev]"

      - name: Run the C2-D portable mutants (every mutant must be caught)
        shell: bash
        run: |
          python scripts/ci/c2d_platform_mutants.py --profile portable

      - name: Run the C2-D POSIX mutants (every mutant must be caught)
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          python scripts/ci/c2d_platform_mutants.py --profile posix
