[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rig-sentinel"
version = "0.1.0"
description = "Open-source Agent Exposure Management platform"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
rig-sentinel = "rig_sentinel.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
